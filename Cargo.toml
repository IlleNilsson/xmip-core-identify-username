[package]
name = "xmip-core-identify-username"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-identify-username"
description = "Identify by username: a username presented in the clear, with the password it came with as proof; a transport-layer claim, passed. A xmip-core-identify technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the identifier trait, the arrival and the claim live
# there. The mechanism it reads is declared once in xmip-core (ADR-0050).
identify = { workspace = true }
# The names the transport writes on the arrival (context::property).
context = { workspace = true }
xcore = { workspace = true }

[lints]
workspace = true
